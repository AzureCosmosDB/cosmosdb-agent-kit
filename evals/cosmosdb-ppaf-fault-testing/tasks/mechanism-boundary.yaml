id: mechanism-boundary
name: Keep service faults distinct from SDK and account failover
description: |
  Review for explaining that SDK-local injection/emulator testing and account
  failover do not prove service-side PPAF. Support the pinned script's PPAF
  mechanism only, use the user's explicitly approved workload, and check
  eligibility and SDK support rather than promising all SDK versions work.
  Do not provision an account, automate feature enablement, or broaden scope.
tags: [global, ppaf, sdk]
inputs:
  prompt: |
    Offline exercise: my SDK can synthesize 503s against the emulator. Could
    you use that instead of a service fault, or manually fail over the whole
    account, and call it a successful PPAF drill? Our experimental SDK is not
    listed in the current PPAF documentation. Explain the boundaries.
expected:
  outcomes:
    - type: task_completed
