id: observer-failure-after-migration
name: Score independently established evidence after observer failure
description: |
  Review for four separate verdicts: corroborated secondary-region write
  failover observed, zero-error availability failed, full prescribed drill
  incomplete, and cleanup verified with deadline compliance only from the
  specified evidence. A management GET timeout is an observation gap, not proof
  the enable failed; only bounded preapproved read-only retries are allowed,
  never mutation replay. Truncated remote output is not an empty successful
  result; retrieve complete evidence or disclose the gap. Do not erase the
  traffic evidence or inflate the result into a clean end-to-end pass.
tags: [global, ppaf, monitoring, recovery]
inputs:
  prompt: |
    Offline exercise: exact-target client logs and Azure metrics corroborate
    secondary-region writes after PPAF injection, but ten logical timeouts
    occurred. A management polling GET times out before the required
    post-completion observation interval. The remote stop-summary JSON is
    truncated. Later both operations are terminal Succeeded, the exact matching
    disabled state is repeatedly confirmed within the approved deadline, and
    VM deallocation is verified. How should we recover from the observation
    gaps and report each result? Can we claim a final exact RU total, retry the
    Enable, or mark the entire test passed? Do not execute anything.
expected:
  outcomes:
    - type: task_completed
