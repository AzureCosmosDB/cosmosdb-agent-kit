id: first-use-exception
name: Keep missing-resource first use an explicit scoped exception
description: |
  Review for distinguishing a resource-specific missing fault from verified
  inactive state. Only a qualified account owner's separately recorded exception
  for a dedicated non-production account with verified target/feature,
  exclusive ownership, scoped history with no prior fault attempt or known
  pending operation, and all observer/recovery gates can permit first use.
  Do not automatically apply the exception, initialize with Disable, treat
  production as eligible, or let approval substitute for working observation.
tags: [global, ppaf, approval]
inputs:
  prompt: |
    Offline exercise: a newly created dedicated test account has PPAF enabled.
    The exact fault GET says PerPartitionAutomaticFailover Chaos Fault Not Found.
    The qualified account owner verified exclusive ownership and operation
    history with no previous fault attempt or known pending operation, and
    explicitly authorized a recorded first-use exception. All scoped workload,
    RU budget, observer, recovery and deadline gates are satisfied.
    Explain how to record the baseline and whether the plan can proceed.
    Would the same answer apply to production, generic 404s, or unavailable
    operation monitoring? Do not execute any actions.
expected:
  outcomes:
    - type: task_completed
