id: partial-enable-cleanup
name: Recover an attempted enable even when the script throws
description: |
  Review for treating the PUT as potentially applied despite a later exception,
  using the recovery record saved before enable, and initiating preapproved
  matching disable under bounded supervision. Resolve pending operation ordering
  with the observer/operator; one inactive sample while enable is pending is
  insufficient. Verify inactive baseline and terminal completion or escalate as
  unresolved. Do not wait for a local enabled=true flag or broaden fault scope.
  A Disable 404 during pending Enable is not cleanup. Retain the operation
  identity, coordinate settlement, retry only matching cleanup within the
  approved budget, and avoid concurrent PUT loops or another Enable.
tags: [global, ppaf, recovery]
inputs:
  prompt: |
    Offline exercise: Enable sent its PUT and then threw while reading Location.
    Our local enabled flag was never set. Disable returned Chaos Fault Not Found,
    but the enable Location GET is HTTP 202 and fault GET still says Enabling.
    Should cleanup be skipped or should we enable again to initialize the fault?
    The approved recovery record and independent operator are available.
expected:
  outcomes:
    - type: task_completed
