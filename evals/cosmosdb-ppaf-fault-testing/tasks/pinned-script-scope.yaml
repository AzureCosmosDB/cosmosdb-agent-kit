id: pinned-script-scope
name: Inspect and respect the exact upstream implementation
description: |
  Review for pinning revision 84105f271ec042a016f3e69b8911edbfd80fea14,
  download then inspection/hash recording, and no vendoring/modification.
  Reject ServiceUnavailability despite ValidateSet because all URIs hardcode
  PPAF. Identify public ARM host, native CLI context mutation, unescaped JSON
  parameters and fixed waits; never silently switch source or bypass warnings.
  Preserve outer properties and PascalCase Action, Region, DatabaseName and
  ContainerName from the script, rather than rewriting them to schema-example
  lowercase. Distinguish an approved equivalent REST action from running the
  pinned script itself; do not treat a failed PUT as necessarily unapplied.
tags: [global, ppaf, tooling]
inputs:
  prompt: |
    Offline exercise: download the latest EnableDisableChaosFault.ps1 from main
    and use FaultType ServiceUnavailability because ValidateSet permits it.
    If necessary, patch and vendor it for a sovereign-cloud account. The
    container name also contains a double quote. Is this compatible with the
    PPAF skill's supported procedure? A generated API example uses lowercase
    action and region; should I normalize the script's JSON keys to match it?
    Do not download or execute anything.
expected:
  outcomes:
    - type: task_completed
