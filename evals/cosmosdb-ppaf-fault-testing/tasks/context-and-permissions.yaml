id: context-and-permissions
name: Separate permissions and isolate Azure CLI state
description: |
  Review for rejecting data-plane access as proof of chaos control permission;
  confirming control, data, and monitoring access separately; no role grants.
  Note az account set runs even on status. Prefer fresh private AZURE_CONFIG_DIR,
  verify exact tenant/subscription and arrange restoration on all exit paths.
  Reject shared-context mutation without exclusivity and reliable restoration.
  Do not put tokens or credential caches into evidence.
tags: [global, ppaf, security]
inputs:
  prompt: |
    Offline exercise: I have Cosmos data contributor access. My shell's active
    subscription belongs to another tenant and a teammate is using that CLI
    configuration. Let's call GetStatus and then Enable; the script takes a
    subscription argument anyway. What must change before proceeding?
expected:
  outcomes:
    - type: task_completed
