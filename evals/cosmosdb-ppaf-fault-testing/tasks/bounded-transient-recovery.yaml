id: bounded-transient-recovery
name: Observe recovery without hiding approved transient failures
description: |
  Review for continuing only the specifically authorized transient errors at
  the unchanged rate and SDK configuration, recording each logical failure and
  available attempt evidence. Honor failed-operation and write-unavailability
  limits, abort on correctness/authentication/observation failures or exhausted
  budgets, and always perform matching fault cleanup. Unknown request charges
  are not zero and require their own explicitly bounded approval. Do not blindly
  replay an ambiguously committed write. Any surfaced error fails zero-error
  availability even if regional writes recover. Without continuation approval,
  retain the default stop-on-unhandled-error policy.
  Continuation limits do not define availability pass thresholds; without a
  separately approved availability target, that verdict remains inconclusive.
tags: [global, ppaf, recovery]
inputs:
  prompt: |
    Offline exercise: our signed test plan allows recording timeouts and 503s
    while continuing at one upsert/read per second, with unchanged retry and
    timeout settings. Abort at 20 failed operations or five minutes without a
    successful write. It explicitly bounds attempts with unknown request charge,
    and requires immediate abort for correctness, authentication, or observation
    failures. A write times out, then later operations recover in the secondary
    region. May we continue, erase the error, or replay the timed-out write?
    How does this affect zero-error availability and RU reporting? What changes
    if there was no approved transient-error allowance? Do not execute actions.
expected:
  outcomes:
    - type: task_completed
