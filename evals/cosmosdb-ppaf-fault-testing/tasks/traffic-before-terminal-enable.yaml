id: traffic-before-terminal-enable
name: Retain observed traffic migration before management completion
description: |
  Review for separating corroborated traffic migration from terminal enable
  and the required post-completion interval. Preserve timestamped target-scoped
  successful secondary-region application writes and independent metrics even
  when the controller phase is still enable. Do not treat pending management
  status or numeric action alone as proof of migration, completion, all-partition
  coverage, or exact recovery latency. Preserve bounded polling and deadlines.
tags: [global, ppaf, monitoring]
inputs:
  prompt: |
    Offline exercise: the approved target started as a single-write account
    writing to East US. After our scoped PPAF enable, client request logs and
    independent container-scoped service metrics both show successful writes
    in West US 2 with verified reads. No topology changes or other drills ran.
    Location still returns HTTP 202/Dequeued and fault GET says Enabling.
    Our observer only counts traffic after terminal enable in an active phase.
    Should it discard these writes or declare the whole drill passed now?
    Explain which claims are supported and how to retain the evidence.
expected:
  outcomes:
    - type: task_completed
