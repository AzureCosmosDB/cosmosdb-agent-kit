# harbor-format-curation configuration for cosmos-sdk-skills benchmark.
# See the internal "Adding a Benchmark" guide.

[import]
from = "path"
# Points to the directory containing ONLY task folders (each with task.toml).
path = "./tasks"
staging-folder = "${TEMP}/harborcuration/cosmos-sdk-skills"

[docker.local]
registry = "localhost:5000"
provider = "Docker localhost registry"
benchmark = "cosmos-sdk-skills"
type = "eval"
architecture = "x86_64"
version = "0.0.1"

# The [docker.prod] profile targets an internal Azure Container Registry and is NOT
# committed here to keep the registry name out of this public repo. The GitHub
# publishing workflow has been retired. For separately approved local publishing,
# append a matching [docker.prod] section with registry = "<your-acr>.azurecr.io".
